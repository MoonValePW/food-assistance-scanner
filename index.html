<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Scan — Food Assistance</title>

<!-- Installs to the home screen as a standalone app: no address bar, no
     browser toolbar, and roughly 15% more screen for the viewfinder. This is
     also the closest the platform allows the scanner to get to being "inside"
     the dashboard — see WHY THIS PAGE EXISTS below. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scan">
<meta name="theme-color" content="#11141a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<!--
  Standalone QR scanner for the Food Assistance Dashboard.

  WHY THIS PAGE EXISTS
  --------------------
  Google Apps Script renders a web app's HTML inside a cross-origin iframe that
  Google controls. That iframe is not granted camera permission, so
  getUserMedia() fails with NotAllowedError on iOS Safari no matter what the
  user allows - confirmed by the app's own camera check.

  This cannot be worked around by embedding this page inside the app either.
  Permissions Policy is inherited: an iframe's allow="camera" can only DELEGATE
  a permission the embedding document already holds, and the Apps Script frame
  holds none. A nested frame would fail exactly as the app itself does.

  So the scanner is served from ordinary static hosting, where it is the
  top-level document and grants its own camera permission. It scans
  continuously, then hands the token to the Apps Script app, which does the
  actual check-in. Installed to the home screen it opens chrome-less, which is
  what makes the two halves read as one app.

  SECURITY
  --------
  This file contains no secrets, holds no family data and needs no sign-in. It
  reads a QR code and navigates to the check-in URL; every check-in is still
  authenticated and authorised by Apps Script. The scanned token never leaves
  the browser except in that navigation to Google, so the static host never
  sees it.

  SETUP
  -----
  Set CHECKIN_URL below to your deployed /exec URL, then host this folder
  anywhere static (GitHub Pages, Netlify, Cloudflare Pages). Must be HTTPS -
  browsers refuse camera access otherwise.
-->
<style>
  /*
    Deliberately dark in both colour schemes, unlike the dashboard.

    This screen is a viewfinder. Every camera surface a volunteer has ever used
    is dark, a bright chrome around a dark preview reads as a bug, and the
    distribution runs after sunset. The palette is otherwise the dashboard's own
    dark theme, so the handoff to the check-in screen is not a jolt.
  */
  :root {
    --bg: #11141a;
    --surface: #191d25;
    --surface-2: #21262f;
    --border: #313846;
    --text: #eef1f6;
    --muted: #9aa4b4;
    --primary: #5b8dfb;
    --success: #4ade80;
    --danger: #f87171;

    --radius: 14px;
    --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior-y: none;
  }

  /* ---- Top bar -------------------------------------------------------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: var(--s3);
    padding: var(--s3) var(--s4);
    border-bottom: 1px solid var(--border);
  }
  .mark {
    width: 26px; height: 26px; flex: none;
    border-radius: 8px;
    background: linear-gradient(140deg, var(--primary), #8ab0ff);
  }
  .titles { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .titles strong { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .titles small { font-size: 12px; color: var(--muted); }

  /* A live indicator rather than a word: the dot is readable at arm's length,
     which "Camera on" in 13px grey was not. */
  .badge {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .badge::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
  }
  .badge.live::before { background: var(--success); box-shadow: 0 0 0 3px rgba(74, 222, 128, .18); }

  /* ---- Viewfinder ----------------------------------------------------- */

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--s3);
    padding: var(--s4);
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
  }

  .stage { position: relative; margin: 0 auto; width: 100%; max-width: 460px; }

  /*
    The preview is a fixed-shape box that the video is forced to fill.

    Sizing was previously left to the scanner library, via its aspectRatio
    option. That is fragile: with the option set the preview letterboxed into a
    black band, and with it removed the container collapsed to nothing and the
    camera was running with no visible picture at all. Both look identical to a
    broken scanner. So the box owns its own dimensions here - do not hand
    sizing back to the library.
  */
  #reader {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 58vh;
    min-height: 300px;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
  }
  #reader > div,
  #reader__scan_region {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }
  #reader video {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
  }
  /* The library draws its own border, status line and info icon. Ours replace
     them, and two sets of scan furniture on one preview looks unfinished. */
  #reader img[alt="Info icon"],
  #reader__dashboard_section_csr span,
  #reader__status_span { display: none !important; }
  #reader__scan_region img { display: none !important; }

  /* Corner marks showing where to hold the card. Purely decorative and
     pointer-transparent so it can never swallow a tap. */
  /* A centred SQUARE, because the decoder searches a square region (qrbox is
     85% of the shorter edge). Stretching the marks to the box would promise a
     scan area that does not exist, and the lower marks would sit behind the
     status pill. */
  .frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 74%;
    aspect-ratio: 1;
    pointer-events: none;
  }
  .frame i {
    position: absolute;
    width: 30px; height: 30px;
    border: 3px solid rgba(255, 255, 255, .92);
  }
  .frame i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .frame i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .frame i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .frame i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }

  /* ---- Status --------------------------------------------------------- */

  /*
    Sits over the bottom of the preview so the eye never leaves the picture.
    Neutral by default; it only takes on colour when something has actually
    happened, so colour still means something.
  */
  .status {
    position: absolute;
    left: var(--s3); right: var(--s3); bottom: var(--s3);
    margin: 0;
    padding: 10px var(--s3);
    border-radius: 12px;
    background: rgba(12, 15, 20, .82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .10);
    color: #fff;
    font-size: 15px;
    font-weight: 560;
    text-align: center;
  }
  .status.ok  { background: rgba(20, 83, 45, .90);  border-color: rgba(74, 222, 128, .45); }
  .status.err { background: rgba(93, 24, 24, .92);  border-color: rgba(248, 113, 113, .45); }

  /* ---- Controls ------------------------------------------------------- */

  .controls { display: flex; gap: var(--s2); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex: 1;
    min-height: 52px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: #0b0e13; }
  .btn:active { transform: scale(.985); }

  select {
    width: 100%;
    min-height: 48px;
    padding: 12px;
    font: inherit;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  /*
    What the camera is actually doing, in numbers.

    "It shows a picture but nothing happens" has two completely different
    causes: the decoder is not running at all, or it is running and cannot read
    the code. They are indistinguishable by eye and need opposite fixes, so the
    page counts its own decode attempts and says so.
  */
  .diag {
    margin: 0;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted);
    text-align: center;
  }
  .diag:empty { display: none; }

  .hint {
    margin: 0;
    font-size: 13px;
    line-height: 1.55;
    color: var(--muted);
    text-align: center;
  }
  .hint:empty { display: none; }
  .hint strong { color: var(--text); }

  /* The way out when a card will not scan. Understated, but never hidden
     behind a menu - it is the fallback a volunteer needs in a hurry. */
  .escape {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px;
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: var(--s3);
    color: var(--primary);
    text-decoration: none;
    font-size: 15px;
    font-weight: 560;
  }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .btn:active { transform: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="mark" aria-hidden="true"></span>
  <span class="titles">
    <strong>Food Assistance</strong>
    <small>Scan family card</small>
  </span>
  <span class="badge" id="badge"></span>
</header>

<main>
  <div class="stage">
    <div id="reader"></div>
    <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="status" id="status" role="status" aria-live="polite">Starting camera…</p>
  </div>

  <div class="controls">
    <button class="btn hidden" id="torch" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
      <span>Light</span>
    </button>
    <button class="btn" id="switch" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4"/><path d="M21 7H8a4 4 0 0 0-4 4v1"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h13a4 4 0 0 0 4-4v-1"/></svg>
      <span>Switch camera</span>
    </button>
  </div>

  <button class="btn btn--primary hidden" id="start" type="button">Start camera</button>

  <select id="cameras" class="hidden" aria-label="Camera"></select>

  <p class="diag" id="diag"></p>
  <p class="hint" id="hint"></p>

  <a class="escape" id="manual" href="#">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    Search by name instead
  </a>
</main>

<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  // ===========================================================================
  // SET THIS to your deployed Apps Script /exec URL.
  // ===========================================================================
  var CHECKIN_URL = 'https://script.google.com/macros/s/AKfycbxxSBbzkaEeKtPOV2Jly8OwagB5nMTacZUpQv9ObhY9WIhOeJdVtRvp6NYPJYO6Wi0-yg/exec';

  var el = function (id) { return document.getElementById(id); };
  var status = el('status');
  var scanner = null, running = false, busy = false, torchOn = false;
  var checks = 0, diagTimer = null;

  // Bumped on every publish. Caches on phones are aggressive and a stale page
  // is indistinguishable from a fix that did not work.
  var BUILD = '2026-09-02d';
  var last = { text: null, at: 0 };

  el('manual').href = CHECKIN_URL;

  /** The live indicator in the top bar. */
  function badge(text, live) {
    var b = el("badge");
    b.textContent = text || "";
    b.className = "badge" + (live ? " live" : "");
  }

  function say(msg, cls) {
    status.textContent = msg;
    status.className = 'status' + (cls ? ' ' + cls : '');
  }

  function feedback(ok) {
    if (navigator.vibrate) { try { navigator.vibrate(ok ? 45 : [110, 60, 110]); } catch (e) {} }
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = ok ? 1050 : 320;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } catch (e) { /* sound is optional */ }
  }

  /**
   * Accepts either form of card: a full check-in URL carrying ?t=<token>, or a
   * bare token. Both have been printed at different times, and both must work.
   */
  function extractToken(scanned) {
    if (!scanned) return null;
    var raw = String(scanned).replace(/\s+/g, '');
    if (!raw) return null;
    var m = raw.match(/[?&#]t=([A-Za-z0-9_\-]{16,})/i);
    if (m) return m[1];
    if (/^[A-Za-z0-9_\-]{16,}={0,2}$/.test(raw)) return raw.replace(/=+$/, '');
    return null;
  }

  function onScan(text) {
    if (busy) return;

    // The decoder fires continuously while a code is in frame; ignore repeats
    // so one card cannot trigger several navigations.
    var now = Date.now();
    if (text === last.text && now - last.at < 4000) return;
    last = { text: text, at: now };

    var token = extractToken(text);
    if (!token) {
      feedback(false);
      say('That is not a family card. Try again.', 'err');
      return;
    }

    busy = true;
    feedback(true);
    say('Card read — opening check-in…', 'ok');
    stop();

    // Hand off to Apps Script, which authenticates the staff member and does
    // the actual check-in. Nothing is recorded by this page.
    window.location.href = CHECKIN_URL + '?t=' + encodeURIComponent(token);
  }

  /**
   * Scanner configuration.
   *
   * THE CAMERA CHOICE MUST LIVE INSIDE videoConstraints. From the library's own
   * start():
   *
   *     var a = c ? s.videoConstraints : h.createVideoConstraints(t);
   *
   * where `c` is "config.videoConstraints was supplied and is valid" and `t` is
   * the camera passed as the first argument. So when videoConstraints is
   * present, THE CAMERA ARGUMENT IS IGNORED COMPLETELY.
   *
   * This previously supplied videoConstraints carrying resolution and focus but
   * no camera selection, which silently discarded the chosen rear camera and
   * let iOS fall back to its default — the front one. The picker showed "Back
   * Camera" because that was the intent; the library never received it.
   *
   * Everything therefore goes in one object.
   */
  function config(cameraSelector) {
    var constraints = {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      advanced: [{ focusMode: 'continuous' }]
    };

    for (var k in cameraSelector) {
      if (cameraSelector.hasOwnProperty(k)) constraints[k] = cameraSelector[k];
    }

    return {
      fps: 15,
      qrbox: function (w, h) {
        var edge = Math.floor(Math.min(w, h) * 0.85);
        return { width: edge, height: edge };
      },
      // No forced aspectRatio: the preview box is sized in CSS instead, so the
      // library cannot letterboard or collapse it.
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      videoConstraints: constraints
    };
  }

  /**
   * Chooses the rear camera by DEVICE, not by facingMode.
   *
   * facingMode: 'environment' is a request the browser may ignore — on iOS it
   * frequently hands back the front camera, which points at the ceiling and
   * shows a black preview that looks exactly like a broken scanner.
   *
   * iOS labels its cameras "Front Camera", "Back Camera", "Back Dual Wide
   * Camera", "Back Ultra Wide Camera". Plain "Back Camera" is preferred: the
   * ultra-wide cannot focus on something held close, which is the other way
   * this looks broken.
   */
  /**
   * True for a rear camera that cannot focus on something held at card
   * distance: the ultra-wide, and the combined "Dual"/"Triple" modules that
   * can switch down to it. They produce a picture that looks fine and is too
   * soft to decode.
   */
  function poorAtCloseRange(label) {
    return /ultra|dual|triple|tele/i.test(label || '');
  }

  function isRearLabel(label) {
    return /back|rear|environment/i.test(label || '');
  }

  function anyRearCamera(devices) {
    for (var i = 0; i < devices.length; i++) {
      if (isRearLabel(devices[i].label)) return true;
    }
    return false;
  }

  /** The plain rear camera, if this phone offers one. */
  function plainBackCamera(devices) {
    for (var i = 0; i < devices.length; i++) {
      var l = devices[i].label || '';
      if (/back|rear/i.test(l) && !poorAtCloseRange(l)) return devices[i];
    }
    return null;
  }

  function pickRearCamera(devices) {
    if (!devices || !devices.length) return null;

    var saved = null;
    try { saved = localStorage.getItem('fad.camera'); } catch (e) {}

    if (saved) {
      for (var s = 0; s < devices.length; s++) {
        if (devices[s].id !== saved) continue;

        // A remembered choice is honoured only while it is still a sane one.
        //
        // Remembering it was meant to save a tap. What it actually did was make
        // one wrong tap permanent. "Switch camera" cycles through every lens
        // the phone reports, including the selfie camera and the wide modules
        // that cannot focus at card distance, and whatever it landed on was
        // written to storage and reused forever. Both failures look identical
        // from the outside: a live, plausible picture that never decodes. A
        // preference that can quietly disable the scanner is not worth keeping.
        var label = devices[s].label || '';

        // Not a rear camera at all. Only honour that if this phone genuinely
        // offers nothing else, so an escape hatch survives for a device whose
        // labels are wrong.
        if (!isRearLabel(label)) {
          if (anyRearCamera(devices)) break;
          return saved;
        }

        // A rear camera, but one that cannot focus this close.
        if (poorAtCloseRange(label)) {
          var better = plainBackCamera(devices);
          if (better) {
            try { localStorage.setItem('fad.camera', better.id); } catch (e) {}
            return better.id;
          }
        }
        return saved;
      }
    }

    var backs = devices.filter(function (d) { return isRearLabel(d.label); });
    if (backs.length) {
      for (var i = 0; i < backs.length; i++) {
        if (!poorAtCloseRange(backs[i].label)) return backs[i].id;
      }
      for (var j = 0; j < backs.length; j++) {
        if (!/ultra/i.test(backs[j].label || '')) return backs[j].id;
      }
      return backs[0].id;
    }

    // No labels (permission not yet granted, or a browser that hides them).
    // The rear camera is conventionally last.
    return devices[devices.length - 1].id;
  }

  function start(deviceId) {
    if (running) return;
    if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });

    say('Starting camera…');

    // getCameras() prompts for permission and, once granted, returns labels —
    // which is what makes choosing the rear camera possible at all.
    Html5Qrcode.getCameras().then(function (devices) {
      var id = deviceId || pickRearCamera(devices);
      if (!id) throw { name: 'NotFoundError' };

      /**
       * Tries the chosen camera, then falls back.
       *
       * deviceId is the precise choice and is tried first. If the browser
       * refuses it — iOS device ids can go stale between enumerations —
       * facingMode "exact" still forces a rear camera, and only then do we
       * accept whatever the browser wants to give us.
       */
      function attempt(selectors, i) {
        return scanner.start(selectors[i].camera, config(selectors[i].camera), onScan, onNoCodeThisFrame)
          .catch(function (e) {
            if (i + 1 >= selectors.length) throw e;
            return attempt(selectors, i + 1);
          });
      }

      return attempt([
        { camera: { deviceId: { exact: id } } },
        { camera: { facingMode: { exact: 'environment' } } },
        { camera: { facingMode: 'environment' } }
      ], 0).then(function () {
        running = true;
        try { localStorage.setItem('fad.camera', id); } catch (e) {}
        el('start').className = 'btn btn--primary hidden';
        say('Point the camera at the family’s card.');
        badge('Scanning', true);
        checks = 0;
        startDiagnostics();
        setUpTorch();
        showCameras(devices, id);
        checkPreviewVisible();
      });
    }).catch(function (err) {
      running = false;
      el('start').className = 'btn btn--primary';
      el('start').textContent = 'Allow camera';
      badge('Camera off', false);
      say(err && err.name === 'NotAllowedError'
        ? 'Camera permission was refused. Tap "Allow camera", and check Settings → Safari → Camera.'
        : 'Could not start the camera on this device.', 'err');
      el('hint').textContent =
        'If this keeps failing, open the app itself and use "Use phone camera instead", which takes a single photo.';
    });
  }

  /**
   * Checks that a picture is on screen AND that it is the rear camera.
   *
   * Asking for a camera is not the same as getting one. Some browsers — iOS
   * in-app browsers especially, the kind that open when a link is tapped inside
   * another app — ignore deviceId and facingMode entirely and hand back the
   * front camera regardless. The picker then reads "Back Camera" while the
   * volunteer is looking at their own face, which is impossible to diagnose
   * from the outside.
   *
   * getRunningTrackSettings() reports what the browser actually gave us, so the
   * page can say plainly that the request was overruled, and by whom.
   */
  function checkPreviewVisible() {
    setTimeout(function () {
      if (!running) return;

      var v = document.querySelector('#reader video');
      var w = v ? v.getBoundingClientRect().width : 0;
      var h = v ? v.getBoundingClientRect().height : 0;

      if (!v || w < 40 || h < 40) {
        say('The camera is running but the picture is not showing on this phone.', 'err');
        el('hint').innerHTML =
          'Try another camera above. If none show a picture, open the app and use ' +
          '<strong>"Use phone camera instead"</strong>, which takes a single photo and always works.';
        return;
      }

      var facing = null, label = '';
      try {
        var s = scanner.getRunningTrackSettings() || {};
        facing = s.facingMode || null;
        label = String(s.label || '');
      } catch (e) { /* not all browsers report it */ }

      var isFront = facing === 'user' || /front/i.test(label);
      if (!isFront) { el('hint').textContent = ''; return; }

      say('This is the FRONT camera — your browser overruled the choice.', 'err');
      el('hint').innerHTML =
        '<strong>Open this page in Safari itself</strong>, not from a link inside another app. ' +
        'In-app browsers ignore the camera request and always hand back the selfie camera. ' +
        'Tap the ••• or share button and choose “Open in Safari”, then bookmark it.';
      el('switch').className = 'btn btn--primary';
    }, 1800);
  }

  /**
   * Forces the next camera in the list.
   *
   * When constraints are being ignored, cycling devices explicitly is the only
   * lever left — and it costs one tap, which beats explaining any of this to a
   * volunteer at six in the evening.
   */
  function switchCamera() {
    Html5Qrcode.getCameras().then(function (devices) {
      if (!devices || devices.length < 2) {
        say('This phone only offers one camera to the browser.', 'err');
        return;
      }
      var current = null;
      try { current = localStorage.getItem('fad.camera'); } catch (e) {}

      var i = 0;
      for (var n = 0; n < devices.length; n++) if (devices[n].id === current) i = n;
      var next = devices[(i + 1) % devices.length];

      try { localStorage.setItem('fad.camera', next.id); } catch (e) {}
      say('Switching to ' + (next.label || 'the next camera') + '…');

      if (running) {
        running = false;
        scanner.stop().then(function () { start(next.id); }).catch(function () { start(next.id); });
      } else {
        start(next.id);
      }
    });
  }

  /**
   * Called by the library for every frame that contained no readable code.
   *
   * Counting these is the difference between "the decoder never started" and
   * "the decoder is looking and cannot read this card", which is the first
   * thing worth knowing when someone says nothing happens.
   */
  function onNoCodeThisFrame() { checks++; }

  /** Reports the live camera settings and the decode count, once a second. */
  function startDiagnostics() {
    if (diagTimer) clearInterval(diagTimer);
    diagTimer = setInterval(function () {
      var el2 = el('diag');
      if (!running) { el2.textContent = ''; return; }

      var label = '', w = 0, h = 0;
      try {
        var st = scanner.getRunningTrackSettings() || {};
        label = String(st.label || st.facingMode || '');
        w = st.width || 0;
        h = st.height || 0;
      } catch (e) { /* not all browsers report it */ }

      el2.textContent =
        (label ? label + ' - ' : '') +
        (w && h ? w + 'x' + h + ' - ' : '') +
        checks + ' checks - build ' + BUILD;
    }, 1000);
  }

  function stop() {
    if (scanner && running) {
      running = false;
      try { scanner.stop().catch(function () {}); } catch (e) {}
    }
  }

  function setUpTorch() {
    var btn = el('torch');
    try {
      var caps = scanner.getRunningTrackCapabilities();
      if (!caps || !('torch' in caps)) { btn.className = 'btn hidden'; return; }
      btn.className = 'btn';
      btn.onclick = function () {
        torchOn = !torchOn;
        scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] })
          .then(function () { btn.querySelector("span").textContent = torchOn ? "Light off" : "Light on"; })
          .catch(function () { btn.className = 'btn hidden'; });
      };
    } catch (e) { btn.className = 'btn hidden'; }
  }

  /**
   * Shows the camera picker, with the one actually running selected.
   *
   * The selection must reflect reality: a dropdown reading "Front Camera" while
   * the rear camera is running is worse than no dropdown at all, and that is
   * exactly what the previous version displayed.
   */
  function showCameras(devices, activeId) {
    var sel = el('cameras');
    if (!devices || devices.length < 2) { sel.className = 'hidden'; return; }

    sel.className = '';
    sel.innerHTML = devices.map(function (d, i) {
      return '<option value="' + d.id + '"' + (d.id === activeId ? ' selected' : '') + '>' +
             (d.label || ('Camera ' + (i + 1))) + '</option>';
    }).join('');
    sel.value = activeId;

    sel.onchange = function () {
      var id = this.value;
      try { localStorage.setItem('fad.camera', id); } catch (e) {}
      if (running) {
        running = false;
        scanner.stop().then(function () { start(id); }).catch(function () { start(id); });
      } else {
        start(id);
      }
    };
  }

  el('start').onclick = function () { start(); };
  el('switch').onclick = switchCamera;

  // Release the camera when the tab is hidden; some phones will not hand it
  // back to another app otherwise.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (!busy) start();
  });

  if (!window.isSecureContext) {
    say('This page must be served over HTTPS for the camera to work.', 'err');
  } else {
    start();
  }
})();
</script>
</body>
</html>
