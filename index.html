<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Scan — Food Assistance</title>
<!--
  Standalone QR scanner for the Food Assistance Dashboard.

  WHY THIS PAGE EXISTS
  --------------------
  Google Apps Script renders a web app's HTML inside a cross-origin iframe that
  Google controls. That iframe is not granted camera permission, so
  getUserMedia() fails with NotAllowedError on iOS Safari no matter what the
  user allows — confirmed by the app's own camera check. No code inside an Apps
  Script project can change that; the permission is set by the parent frame.

  This page is served from ordinary static hosting, so it is the top-level
  document and grants its own camera permission. It scans continuously, then
  hands the token to the Apps Script app, which does the actual check-in.

  SECURITY
  --------
  This file contains no secrets and needs no sign-in. It reads a QR code and
  navigates to the check-in URL; every check-in is still authenticated and
  authorised by Apps Script. The scanned token never leaves the browser except
  in that navigation to Google, so the static host never sees it.

  SETUP
  -----
  Set CHECKIN_URL below to your deployed /exec URL, then host this folder
  anywhere static (GitHub Pages, Netlify, Cloudflare Pages). Must be HTTPS —
  browsers refuse camera access otherwise.
-->
<style>
  :root {
    --bg: #0f1218; --surface: #191d25; --border: #2c3340;
    --text: #eef1f6; --muted: #9aa4b4;
    --primary: #5b8dfb; --success: #4ade80; --danger: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header strong { font-size: 15px; font-weight: 650; }
  header span { margin-left: auto; font-size: 13px; color: var(--muted); }
  main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  /*
    The preview is a fixed-shape box that the video is forced to fill.

    Sizing was previously left to the scanner library, via its aspectRatio
    option. That is fragile: with the option set the preview letterboxed into a
    black band, and with it removed the container collapsed to nothing and the
    camera was running with no visible picture at all. Both look identical to a
    broken scanner.

    So the box owns its own dimensions here, and the video is absolutely
    positioned to cover it. Whatever inline styles the library applies, there is
    always a preview of a known size.
  */
  #reader {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    aspect-ratio: 3 / 4;
    min-height: 320px;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
  }
  /* The library nests the video inside its own wrapper divs. */
  #reader > div,
  #reader__scan_region {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }
  #reader video {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
  }
  #reader img[alt="Info icon"] { display: none; }
  /* The library's own status text and camera scaffolding duplicate ours. */
  #reader__dashboard_section_csr span,
  #reader__status_span { display: none !important; }
  .status {
    text-align: center; font-size: 15px; color: var(--muted);
    min-height: 24px; padding: 0 8px;
  }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--success); }
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; max-width: 460px; margin: 0 auto;
    min-height: 52px; padding: 12px 18px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font: inherit; font-weight: 620; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: #0b0e13; }
  .btn:active { transform: scale(.985); }
  select {
    width: 100%; max-width: 460px; margin: 0 auto;
    min-height: 48px; padding: 12px; font-size: 16px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
  }
  .hidden { display: none !important; }
  .hint { text-align: center; font-size: 13px; color: var(--muted); max-width: 460px; margin: 0 auto; }
  a { color: var(--primary); }
</style>
</head>
<body>

<header>
  <strong>Scan family card</strong>
  <span id="badge"></span>
</header>

<main>
  <div id="reader"></div>
  <p class="status" id="status">Starting camera…</p>

  <button class="btn btn--primary hidden" id="start">Start camera</button>
  <button class="btn hidden" id="torch">Light on</button>
  <select id="cameras" class="hidden"></select>

  <p class="hint" id="hint"></p>
  <p class="hint"><a id="manual" href="#">Open the app to search by name instead</a></p>
</main>

<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  // ===========================================================================
  // SET THIS to your deployed Apps Script /exec URL.
  // ===========================================================================
  var CHECKIN_URL = 'https://script.google.com/macros/s/AKfycbxxSBbzkaEeKtPOV2Jly8OwagB5nMTacZUpQv9ObhY9WIhOeJdVtRvp6NYPJYO6Wi0-yg/exec';

  var el = function (id) { return document.getElementById(id); };
  var status = el('status');
  var scanner = null, running = false, busy = false, torchOn = false;
  var last = { text: null, at: 0 };

  el('manual').href = CHECKIN_URL;

  function say(msg, cls) {
    status.textContent = msg;
    status.className = 'status' + (cls ? ' ' + cls : '');
  }

  function feedback(ok) {
    if (navigator.vibrate) { try { navigator.vibrate(ok ? 45 : [110, 60, 110]); } catch (e) {} }
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = ok ? 1050 : 320;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } catch (e) { /* sound is optional */ }
  }

  /**
   * Accepts either form of card: a full check-in URL carrying ?t=<token>, or a
   * bare token. Both have been printed at different times, and both must work.
   */
  function extractToken(scanned) {
    if (!scanned) return null;
    var raw = String(scanned).trim();
    var m = raw.match(/[?&]t=([A-Za-z0-9_\-]{16,})/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_\-]{16,}$/.test(raw)) return raw;
    return null;
  }

  function onScan(text) {
    if (busy) return;

    // The decoder fires continuously while a code is in frame; ignore repeats
    // so one card cannot trigger several navigations.
    var now = Date.now();
    if (text === last.text && now - last.at < 4000) return;
    last = { text: text, at: now };

    var token = extractToken(text);
    if (!token) {
      feedback(false);
      say('That is not a family card. Try again.', 'err');
      return;
    }

    busy = true;
    feedback(true);
    say('Card read — opening check-in…', 'ok');
    stop();

    // Hand off to Apps Script, which authenticates the staff member and does
    // the actual check-in. Nothing is recorded by this page.
    window.location.href = CHECKIN_URL + '?t=' + encodeURIComponent(token);
  }

  /**
   * Scanner configuration.
   *
   * THE CAMERA CHOICE MUST LIVE INSIDE videoConstraints. From the library's own
   * start():
   *
   *     var a = c ? s.videoConstraints : h.createVideoConstraints(t);
   *
   * where `c` is "config.videoConstraints was supplied and is valid" and `t` is
   * the camera passed as the first argument. So when videoConstraints is
   * present, THE CAMERA ARGUMENT IS IGNORED COMPLETELY.
   *
   * This previously supplied videoConstraints carrying resolution and focus but
   * no camera selection, which silently discarded the chosen rear camera and
   * let iOS fall back to its default — the front one. The picker showed "Back
   * Camera" because that was the intent; the library never received it.
   *
   * Everything therefore goes in one object.
   */
  function config(cameraSelector) {
    var constraints = {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      advanced: [{ focusMode: 'continuous' }]
    };

    for (var k in cameraSelector) {
      if (cameraSelector.hasOwnProperty(k)) constraints[k] = cameraSelector[k];
    }

    return {
      fps: 15,
      qrbox: function (w, h) {
        var edge = Math.floor(Math.min(w, h) * 0.85);
        return { width: edge, height: edge };
      },
      // No forced aspectRatio: the preview box is sized in CSS instead, so the
      // library cannot letterboard or collapse it.
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      videoConstraints: constraints
    };
  }

  /**
   * Chooses the rear camera by DEVICE, not by facingMode.
   *
   * facingMode: 'environment' is a request the browser may ignore — on iOS it
   * frequently hands back the front camera, which points at the ceiling and
   * shows a black preview that looks exactly like a broken scanner.
   *
   * iOS labels its cameras "Front Camera", "Back Camera", "Back Dual Wide
   * Camera", "Back Ultra Wide Camera". Plain "Back Camera" is preferred: the
   * ultra-wide cannot focus on something held close, which is the other way
   * this looks broken.
   */
  function pickRearCamera(devices) {
    if (!devices || !devices.length) return null;

    var saved = null;
    try { saved = localStorage.getItem('fad.camera'); } catch (e) {}
    if (saved) {
      for (var s = 0; s < devices.length; s++) if (devices[s].id === saved) return saved;
    }

    var backs = devices.filter(function (d) { return /back|rear|environment/i.test(d.label || ''); });
    if (backs.length) {
      for (var i = 0; i < backs.length; i++) {
        var label = backs[i].label || '';
        if (/back camera/i.test(label) && !/ultra|wide|tele/i.test(label)) return backs[i].id;
      }
      for (var j = 0; j < backs.length; j++) {
        if (!/ultra/i.test(backs[j].label || '')) return backs[j].id;
      }
      return backs[0].id;
    }

    // No labels (permission not yet granted, or a browser that hides them).
    // The rear camera is conventionally last.
    return devices[devices.length - 1].id;
  }

  function start(deviceId) {
    if (running) return;
    if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });

    say('Starting camera…');

    // getCameras() prompts for permission and, once granted, returns labels —
    // which is what makes choosing the rear camera possible at all.
    Html5Qrcode.getCameras().then(function (devices) {
      var id = deviceId || pickRearCamera(devices);
      if (!id) throw { name: 'NotFoundError' };

      /**
       * Tries the chosen camera, then falls back.
       *
       * deviceId is the precise choice and is tried first. If the browser
       * refuses it — iOS device ids can go stale between enumerations —
       * facingMode "exact" still forces a rear camera, and only then do we
       * accept whatever the browser wants to give us.
       */
      function attempt(selectors, i) {
        return scanner.start(selectors[i].camera, config(selectors[i].camera), onScan, function () {})
          .catch(function (e) {
            if (i + 1 >= selectors.length) throw e;
            return attempt(selectors, i + 1);
          });
      }

      return attempt([
        { camera: { deviceId: { exact: id } } },
        { camera: { facingMode: { exact: 'environment' } } },
        { camera: { facingMode: 'environment' } }
      ], 0).then(function () {
        running = true;
        try { localStorage.setItem('fad.camera', id); } catch (e) {}
        el('start').className = 'btn btn--primary hidden';
        say('Point the camera at the family’s card.');
        el('badge').textContent = 'Camera on';
        setUpTorch();
        showCameras(devices, id);
        checkPreviewVisible();
      });
    }).catch(function (err) {
      running = false;
      el('start').className = 'btn btn--primary';
      el('start').textContent = 'Allow camera';
      el('badge').textContent = '';
      say(err && err.name === 'NotAllowedError'
        ? 'Camera permission was refused. Tap "Allow camera", and check Settings → Safari → Camera.'
        : 'Could not start the camera on this device.', 'err');
      el('hint').textContent =
        'If this keeps failing, open the app itself and use "Use phone camera instead", which takes a single photo.';
    });
  }

  /**
   * Confirms a picture is actually on screen.
   *
   * "Camera on" only means the stream started. It says nothing about whether
   * anything is visible — twice now the camera has been running happily behind
   * a collapsed or letterboxed container, which to a volunteer is simply a
   * broken scanner. If there is no visible video after a moment, say so and
   * offer the path that does not need one.
   */
  function checkPreviewVisible() {
    setTimeout(function () {
      if (!running) return;
      var v = document.querySelector('#reader video');
      var w = v ? v.getBoundingClientRect().width : 0;
      var h = v ? v.getBoundingClientRect().height : 0;

      if (!v || w < 40 || h < 40) {
        say('The camera is running but the picture is not showing on this phone.', 'err');
        el('hint').innerHTML =
          'Try another camera above. If none show a picture, open the app and use ' +
          '<strong>"Use phone camera instead"</strong>, which takes a single photo and always works.';
      }
    }, 1800);
  }

  function stop() {
    if (scanner && running) {
      running = false;
      try { scanner.stop().catch(function () {}); } catch (e) {}
    }
  }

  function setUpTorch() {
    var btn = el('torch');
    try {
      var caps = scanner.getRunningTrackCapabilities();
      if (!caps || !('torch' in caps)) { btn.className = 'btn hidden'; return; }
      btn.className = 'btn';
      btn.onclick = function () {
        torchOn = !torchOn;
        scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] })
          .then(function () { btn.textContent = torchOn ? 'Light off' : 'Light on'; })
          .catch(function () { btn.className = 'btn hidden'; });
      };
    } catch (e) { btn.className = 'btn hidden'; }
  }

  /**
   * Shows the camera picker, with the one actually running selected.
   *
   * The selection must reflect reality: a dropdown reading "Front Camera" while
   * the rear camera is running is worse than no dropdown at all, and that is
   * exactly what the previous version displayed.
   */
  function showCameras(devices, activeId) {
    var sel = el('cameras');
    if (!devices || devices.length < 2) { sel.className = 'hidden'; return; }

    sel.className = '';
    sel.innerHTML = devices.map(function (d, i) {
      return '<option value="' + d.id + '"' + (d.id === activeId ? ' selected' : '') + '>' +
             (d.label || ('Camera ' + (i + 1))) + '</option>';
    }).join('');
    sel.value = activeId;

    sel.onchange = function () {
      var id = this.value;
      try { localStorage.setItem('fad.camera', id); } catch (e) {}
      if (running) {
        running = false;
        scanner.stop().then(function () { start(id); }).catch(function () { start(id); });
      } else {
        start(id);
      }
    };
  }

  el('start').onclick = function () { start(); };

  // Release the camera when the tab is hidden; some phones will not hand it
  // back to another app otherwise.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (!busy) start();
  });

  if (!window.isSecureContext) {
    say('This page must be served over HTTPS for the camera to work.', 'err');
  } else {
    start();
  }
})();
</script>
</body>
</html>
